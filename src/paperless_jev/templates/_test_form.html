{% from "_icons.html" import icon %}
<form method="post" action="/test" class="test-form">
  <label for="test-doc"><span class="card-h" style="margin-bottom:.2rem">{{ icon("search") }}{{ _("Einzelnes Dokument testen") }}</span>
    <small class="muted">{{ _("ID oder Paperless-Link – schreibt nichts nach Paperless") }}</small></label>
  <div class="test-row">
    <input id="test-doc" name="doc" required inputmode="text" placeholder="{{ _('z. B. 2474 oder https://paperless…/documents/2474/details') }}">
    {% if instances|length > 1 %}<select name="instance_id" aria-label="{{ _('Instanz') }}">{% for i in instances %}<option value="{{ i.id }}">{{ i.name }}</option>{% endfor %}</select>{% endif %}
    <button type="submit" onclick="this.setAttribute('aria-busy','true')">{{ icon("play") }}{{ _("Testen") }}</button>
  </div>
</form>

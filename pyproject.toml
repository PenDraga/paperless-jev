[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-jev"
version = "0.1.0"
description = "Klassifiziert den Paperless-NGX-Posteingang mit TypeSafe Jev"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
paperless-jev = "paperless_jev.app:main"
paperless-jev-spike = "paperless_jev.spike:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperless_jev = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

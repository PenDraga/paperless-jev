# Beispiel: paperless-jev neben Paperless-ngx hinter Traefik.
# Anpassen: Domain, Middlewares, Cert-Resolver und die Netznamen deiner Umgebung.
#
# - Netz "paperless": damit paperless-jev Paperless intern erreicht (http://<paperless-container>:8000)
#   und Paperless den Webhook an http://paperless-jev:8000/hook/... senden kann.
# - Middleware: KEINE mit frameDeny/X-Frame-Options DENY, sonst blockiert der Browser den
#   Dokument-Viewer. paperless-jev setzt selbst X-Frame-Options: SAMEORIGIN.
# - Scannen braucht die Kamera: ein Permissions-Policy-Header darf "camera" nicht sperren
#   (camera=(self) statt camera=()).
# - Anmeldung: PJ_ADMIN_PASSWORD setzen. Schützt stattdessen Authentik o. ä. jede Anfrage,
#   PJ_ALLOW_NO_LOGIN=true setzen; ohne beides ist die Web-UI gesperrt.
# - PJ_TRUSTED_PROXIES: Netz des Traefik-Netzwerks (docker network inspect traefik).
services:
  paperless-jev:
    image: ghcr.io/pendraga/paperless-jev:latest
    container_name: paperless-jev
    restart: unless-stopped
    environment:
      - PJ_LOG_LEVEL=INFO
      - PJ_ADMIN_PASSWORD=${PJ_ADMIN_PASSWORD:?Passwort setzen}
      - PJ_TRUSTED_PROXIES=172.18.0.0/16  # Traefik-Netz
      - TZ=Europe/Zurich
    volumes:
      - paperless-jev-data:/data
    networks:
      - paperless
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.paperless-jev.entrypoints=https
      - traefik.http.routers.paperless-jev.rule=Host(`paperless-jev.example.com`)
      - traefik.http.routers.paperless-jev.middlewares=lan-only@file
      - traefik.http.routers.paperless-jev.tls=true
      - traefik.http.routers.paperless-jev.tls.certresolver=letsencrypt
      - traefik.http.services.paperless-jev.loadbalancer.server.port=8000

volumes:
  paperless-jev-data:

networks:
  paperless:
    name: paperless_default  # Netz deines Paperless-Stacks
    external: true
  traefik:
    external: true

# Betrieb neben den Paperless-Instanzen: im Netz paperless_paperless-internal
# (Zugriff auf http://paperless:8000 usw., Webhooks von dort) und
# hinter Traefik; die Web-UI ist nur aus dem internen Netz erreichbar
# (admin-only@file = IP-Allowlist LAN/DMZ/VPN), ohne Login.
# Eigene Domain in deploy/.env: PJ_DOMAIN=paperless-jev.meine-domain.ch
services:
  paperless-jev:
    image: paperless-jev:latest
    build: ..
    container_name: paperless-jev
    restart: unless-stopped
    environment:
      - PJ_LOG_LEVEL=INFO
    volumes:
      - paperless-jev-data:/data
    networks:
      - paperless
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.paperless-jev.entrypoints=https
      - traefik.http.routers.paperless-jev.rule=Host(`${PJ_DOMAIN:-paperless-jev.example.com}`)
      # hsts-headers-ha statt hsts-headers: ohne frameDeny, sonst blockiert der Browser den Dokument-Viewer.
      # Einbetten durch fremde Seiten verhindert die App selbst (X-Frame-Options: SAMEORIGIN).
      - traefik.http.routers.paperless-jev.middlewares=admin-only@file,hsts-headers-ha@file
      - traefik.http.routers.paperless-jev.tls=true
      - traefik.http.routers.paperless-jev.tls.certresolver=cloudflare
      - traefik.http.services.paperless-jev.loadbalancer.server.port=8000

volumes:
  paperless-jev-data:

networks:
  paperless:
    name: paperless_paperless-internal
    external: true
  traefik:
    external: true
